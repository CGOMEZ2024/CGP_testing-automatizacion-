<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pedidos</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    [role="alert"] { color: #b00020; }
  </style>
</head>
<body>
  <h1>Pedidos</h1>
  <p role="status" id="estado"></p>
  <p role="alert" id="error" hidden></p>
  <ul id="lista"></ul>

  <script type="module">
    const estado = document.querySelector('#estado');
    const error = document.querySelector('#error');
    const lista = document.querySelector('#lista');

    function mostrarError(mensaje) {
      estado.textContent = '';
      error.textContent = mensaje;
      error.hidden = false;
    }

    estado.textContent = 'Cargando pedidos…';
    try {
      const respuesta = await fetch('/api/pedidos');
      if (!respuesta.ok) {
        mostrarError(`No se han podido cargar los pedidos (error ${respuesta.status})`);
      } else {
        const pedidos = await respuesta.json();
        estado.textContent = pedidos.length === 0 ? 'No hay pedidos' : '';
        for (const pedido of pedidos) {
          const li = document.createElement('li');
          li.textContent = `Pedido ${pedido.id} · ${pedido.cliente} · ${pedido.total.toFixed(2)} €`;
          lista.append(li);
        }
      }
    } catch {
      mostrarError('Sin conexión con el servidor');
    }
  </script>
</body>
</html>
