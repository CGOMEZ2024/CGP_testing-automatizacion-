<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Calculadora de propinas</title>
</head>
<body>
  <h1>Calculadora de propinas</h1>
  <form id="calculadora">
    <label for="importe">Importe de la cuenta (€)</label>
    <input id="importe" type="number" step="0.01" min="0" required>
    <label for="porcentaje">Propina</label>
    <select id="porcentaje">
      <option value="10">10 %</option>
      <option value="15">15 %</option>
      <option value="20">20 %</option>
    </select>
    <button type="submit">Calcular</button>
  </form>
  <p>Propina: <output id="propina">0.00</output> €</p>
  <p>Total: <output id="total">0.00</output> €</p>
  <script>
    document.getElementById('calculadora').addEventListener('submit', (evento) => {
      evento.preventDefault();
      const importe = Number(document.getElementById('importe').value);
      const porcentaje = Number(document.getElementById('porcentaje').value);
      const propina = importe * porcentaje / 100;
      // Error de la app: trunca en lugar de redondear a céntimos
      const total = Math.floor((importe + propina) * 100) / 100;
      document.getElementById('propina').textContent = propina.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
    });
  </script>
</body>
</html>
