openapi: 3.0.3
info:
  title: API de pedidos
  version: 1.0.0
  description: Contrato acordado entre el equipo del cliente y el del backend (que aún no existe).
paths:
  /api/pedidos/{id}:
    get:
      summary: Lee un pedido
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: El pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
              examples:
                enviado:
                  value:
                    id: 1042
                    cliente: Ana
                    estado: enviado
                    total: 59.9
                    lineas:
                      - { producto: Teclado, cantidad: 2, precio: 24.9 }
                      - { producto: Alfombrilla, cantidad: 1, precio: 10.1 }
        '404':
          description: No existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Pedido no encontrado }
  /api/pedidos:
    post:
      summary: Crea un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPedido' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
              example:
                id: 1043
                cliente: Luis
                estado: pendiente
                total: 12.5
                lineas:
                  - { producto: Ratón, cantidad: 1, precio: 12.5 }
components:
  schemas:
    Linea:
      type: object
      required: [producto, cantidad, precio]
      properties:
        producto: { type: string }
        cantidad: { type: integer, minimum: 1 }
        precio: { type: number, minimum: 0 }
    Pedido:
      type: object
      required: [id, cliente, estado, total, lineas]
      properties:
        id: { type: integer, minimum: 1 }
        cliente: { type: string }
        estado: { type: string, enum: [pendiente, enviado, entregado, cancelado] }
        total: { type: number, minimum: 0 }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/Linea' }
    NuevoPedido:
      type: object
      required: [cliente, lineas]
      properties:
        cliente: { type: string, minLength: 1 }
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required: [producto, cantidad]
            properties:
              producto: { type: string }
              cantidad: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
