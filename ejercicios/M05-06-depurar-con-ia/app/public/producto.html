<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Producto</title></head>
<body>
  <main>
    <h1 id="nombre"></h1>
    <p>Precio: <span data-testid="precio"></span></p>
    <label>Cantidad <input id="cantidad" type="number" min="1" value="1"></label>
    <button id="anadir">Añadir al carrito</button>
  </main>
  <aside aria-label="Carrito">
    <p>Artículos: <span data-testid="articulos">0</span></p>
    <p>Total: <span data-testid="total">0,00 €</span></p>
  </aside>
  <script>
    const euros = (n) => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    let articulos = 0;
    fetch('/api/producto').then((r) => r.json()).then((p) => {
      document.getElementById('nombre').textContent = p.nombre;
      document.querySelector('[data-testid=precio]').textContent = euros(p.precio);
      document.getElementById('anadir').addEventListener('click', () => {
        articulos += Number(document.getElementById('cantidad').value);
        document.querySelector('[data-testid=articulos]').textContent = articulos;
        document.querySelector('[data-testid=total]').textContent = euros(articulos * p.precio);
      });
    });
  </script>
</body>
</html>
